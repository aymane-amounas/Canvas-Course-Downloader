[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-course-downloader"
version = "1.0.0"
description = "Download and organize accessible Canvas course materials."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
canvas-downloader = "canvas_downloader.cli:main"

[tool.setuptools]
packages = ["canvas_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
